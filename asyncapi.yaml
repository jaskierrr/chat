asyncapi: 3.0.0
info:
  title: Chat WebSocket API
  version: 1.0.0
  description: |
    AsyncAPI спецификация WebSocket сервера для чата. Определяет две команды:
    - /get_room: получение информации об одной комнате
    - /get_rooms_list: получение списка комнат
servers:
  chatServer:
    host: chat.example.com
    pathname: /ws
    protocol: wss
    description: WebSocket сервер чата
    security:
      - $ref: '#/components/securitySchemes/bearerAuth'

channels:
  /get_room:
    address: /get_room
    messages:
      getRoomCommand.message.0:
        $ref: '#/components/messages/GetRoomRequest'
      getRoomResponse.message.0:
        $ref: '#/components/messages/GetRoomResponse'
    description: Запрос информации об одной комнате
  /get_rooms_list:
    address: /get_rooms_list
    messages:
      getRoomsListCommand.message.0:
        $ref: '#/components/messages/GetRoomsListRequest'
      getRoomsListResponse.message.0:
        $ref: '#/components/messages/GetRoomsListResponse'
    description: Запрос списка доступных комнат
  /send_message:
    address: /send_message
    messages:
      sendMessage.message.0:
        $ref: '#/components/messages/SendMessage'
    description: Отправка сообщения в чате
  /get_users_list:
    address: /get_users_list
    messages:
      getUsersListRequest.message.0:
        $ref: '#/components/messages/GetUsersListRequest'
      getUsersListResponse.message.0:
        $ref: '#/components/messages/GetUsersListResponse'
    description: Получение списка пользователей
  /create_room:
    address: /create_room
    messages:
      createRoomRequest.message.0:
        $ref: '#/components/messages/CreateRoomRequest'
      createRoomResponse.message.0:
        $ref: '#/components/messages/CreateRoomResponse'
    description: Создание комнаты

operations:
  GetRoomRequest:
    action: send
    channel:
      $ref: '#/channels/~1get_room'
    summary: Клиент отправляет команду /get_room
    messages:
      - $ref: '#/channels/~1get_room/messages/getRoomCommand.message.0'
  GetRoomResponse:
    action: receive
    channel:
      $ref: '#/channels/~1get_room'
    summary: Сервер отвечает событием get_room_response
    messages:
      - $ref: '#/channels/~1get_room/messages/getRoomResponse.message.0'
  GetRoomsListRequest:
    action: send
    channel:
      $ref: '#/channels/~1get_rooms_list'
    summary: Клиент отправляет команду /get_rooms_list
    messages:
      - $ref: '#/channels/~1get_rooms_list/messages/getRoomsListCommand.message.0'
  GetRoomsListResponse:
    action: receive
    channel:
      $ref: '#/channels/~1get_rooms_list'
    summary: Сервер отвечает событием get_rooms_list_response
    messages:
      - $ref: '#/channels/~1get_rooms_list/messages/getRoomsListResponse.message.0'
  SendMessage:
    action: send
    channel:
      $ref: '#/channels/~1send_message'
    summary: Клиент отправляет сообщение в чат
    messages:
      - $ref: '#/channels/~1send_message/messages/sendMessage.message.0'
  GetUsersListRequest:
    action: send
    channel:
      $ref: '#/channels/~1get_users_list'
    summary: Клиент отправляет id пользователя (чтобы вывести всех доступных пользователей кроме него самого)
    messages:
      - $ref: '#/channels/~1get_users_list/messages/getUsersListRequest.message.0'
  GetUsersListResponse:
    action: receive
    channel:
      $ref: '#/channels/~1get_users_list'
    summary: Сервер отвечает событием get_users_list_response
    messages:
      - $ref: '#/channels/~1get_users_list/messages/getUsersListResponse.message.0'
  CreateRoomRequest:
    action: send
    channel:
      $ref: '#/channels/~1create_room'
    summary: Клиент отправляет id двух и более пользователей для создания комнаты между ними
    messages:
      - $ref: '#/channels/~1create_room/messages/createRoomRequest.message.0'
  CreateRoomResponse:
    action: receive
    channel:
      $ref: '#/channels/~1create_room'
    summary: Сервер отвечает событием create_room_response
    messages:
      - $ref: '#/channels/~1create_room/messages/createRoomResponse.message.0'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  messages:
    GetRoomRequest:
      name: GetRoomRequest
      title: Запрос /get_room
      contentType: application/json
      payload:
        $ref: '#/components/schemas/GetRoomRequest'
    GetRoomResponse:
      name: GetRoomResponse
      title: Ответ /get_room
      contentType: application/json
      payload:
        $ref: '#/components/schemas/GetRoomResponse'
    GetRoomsListRequest:
      name: GetRoomsListRequest
      title: Запрос /get_rooms_list
      contentType: application/json
      payload:
        $ref: '#/components/schemas/GetRoomsListRequest'
    GetRoomsListResponse:
      name: GetRoomsListResponse
      title: Ответ /get_rooms_list
      contentType: application/json
      payload:
        $ref: '#/components/schemas/GetRoomsListResponse'
    SendMessage:
      name: SendMessage
      title: Запрос /send_message
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SendMessage'
    GetUsersListRequest:
      name: GetUsersListRequest
      title: Запрос /get_users_list
      contentType: application/json
      payload:
        $ref: '#/components/schemas/GetUsersListRequest'
    GetUsersListResponse:
      name: GetUsersListResponse
      title: Ответ /get_users_list
      contentType: application/json
      payload:
        $ref: '#/components/schemas/GetUsersListResponse'
    CreateRoomRequest:
      name: CreateRoomRequest
      title: Запрос /create_room
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CreateRoomRequest'
    CreateRoomResponse:
      name: CreateRoomResponse
      title: Ответ /create_room
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CreateRoomResponse'
        

  schemas:
    Head:
      type: object
      properties:
        event:
          type: string
          enum:
            - /get_room
            - /get_rooms_list
            - /send_message
            - /get_users_list
        timestamp:
          type: string
          format: date-time
        token:
          type: string
      required:
        - event
        - timestamp
        - token
      additionalProperties: false

    User:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
      required:
        - user_id
        - username
      additionalProperties: false

    Room:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - room_id
        - name
      additionalProperties: false

    GetRoomRequest:
      type: object
      properties:
        head:
          allOf:
            - $ref: '#/components/schemas/Head'
            - type: object
              properties:
                event:
                  enum:
                    - /get_room
        body:
          type: object
          properties:
            room_id:
              type: string
              format: uuid
          required:
            - room_id
      required:
        - head
        - body
      additionalProperties: false
    GetRoomResponse:
      type: object
      properties:
        head:
          allOf:
            - $ref: '#/components/schemas/Head'
            - type: object
              properties:
                event:
                  enum:
                    - /get_room
        body:
          type: object
          properties:
            room_id:
              type: string
              format: uuid
            room_name:
              type: string
            messages:
              type: array
              items:
                type: object
                properties:
                  message_id:
                    type: string
                    format: uuid
                  timestamp:
                    type: string
                    format: date-time
                  text:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                required:
                  - message_id
                  - timestamp
                  - text
          required:
            - room_id
            - room_name
            - participants
      required:
        - head
        - body
      additionalProperties: false
    GetRoomsListRequest:
      type: object
      properties:
        head:
          allOf:
            - $ref: '#/components/schemas/Head'
            - type: object
              properties:
                event:
                  enum:
                    - /get_rooms_list
        body:
          type: object
          properties:
            user_id:
              type: string
              format: uuid
          required:
            - user_id
      required:
        - head
        - body
      additionalProperties: false
    GetRoomsListResponse:
      type: object
      properties:
        head:
          allOf:
            - $ref: '#/components/schemas/Head'
            - type: object
              properties:
                event:
                  enum:
                    - /get_rooms_list
        body:
          type: object
          properties:
            rooms:
              type: array
              items:
                $ref: '#/components/schemas/Room'
          required:
            - rooms
      required:
        - head
        - body
      additionalProperties: false
    SendMessage:
      type: object
      properties:
        head:
          allOf:
            - $ref: '#/components/schemas/Head'
            - type: object
              properties:
                event:
                  enum:
                    - /send_message
        body:
          type: object
          properties:
            room_id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            text:
              type: string
          required:
            - room_id
            - user_id
            - text
      required:
        - head
        - body
      additionalProperties: false
    GetUsersListRequest:
      type: object
      properties:
        head:
          allOf:
            - $ref: '#/components/schemas/Head'
            - type: object
              properties:
                event:
                  enum:
                    - /get_users_list
        body:
          type: object
          properties:
            user_id:
              type: string
              format: uuid
          required:
            - user_id
      required:
        - head
        - body
      additionalProperties: false
    GetUsersListResponse:
      type: object
      properties:
        head:
          allOf:
            - $ref: '#/components/schemas/Head'
            - type: object
              properties:
                event:
                  enum:
                    - /get_users_list
        body:
          type: object
          properties:
            users:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                required:
                  - id
                  - username
          required:
            - users
      required:
        - head
        - body
      additionalProperties: false
    CreateRoomRequest:
      type: object
      properties:
        head:
          allOf:
            - $ref: '#/components/schemas/Head'
            - type: object
              properties:
                event:
                  enum:
                    - /get_users_list
        body:
          type: object
          properties:
            source_user_id:
              type: string
              format: uuid
              description: ID пользователя, инициирующего создание комнаты
            target_users_ids:
              type: array
              items:
                  type: string
                  format: uuid
      required:
        - source_user_id
        - target_users_ids

    CreateRoomResponse:
      type: object
      properties:
        head:
          allOf:
            - $ref: '#/components/schemas/Head'
            - type: object
              properties:
                event:
                  enum:
                    - /get_users_list
        body:
          type: object
          properties:
            room_id:
              type: string
              format: uuid
              description: Уникальный идентификатор созданной комнаты
      required:
        - roomId