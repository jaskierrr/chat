<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SPA Chat App</title>
        <style>
        /* Темная тема приложения */
        body {
        font-family: Arial, sans-serif;
        background-color: #1e1e1e;
        /* мягкий тёмно-серый фон */
        color: #f0f0f0;
        /* светлый текст */
        margin: 0;
        padding: 0;
        }

        #app {
        max-width: 600px;
        margin: 50px auto;
        background: #2a2a2a;
        /* немного светлее фона для контраста */
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        }

        .page {
        display: none;
        }

        .page.active {
        display: block;
        }

        h2 {
        margin-top: 0;
        color: #ffffff;
        }

        form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        }

        input[type=text],
        input[type=password] {
        padding: 10px;
        border: 1px solid #555;
        border-radius: 4px;
        font-size: 1rem;
        background-color: #3a3a3a;
        color: #f0f0f0;
        }

        button {
        padding: 10px;
        border: none;
        border-radius: 4px;
        background-color: #3d7eff;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
        }

        button:hover {
        background-color: #2f5fd4;
        }

        .error {
        color: #ff5c5c;
        margin-top: 10px;
        }

        #rooms-list {
        list-style: none;
        padding: 0;
        }

        #rooms-list li {
        padding: 10px;
        border-bottom: 1px solid #444;
        cursor: pointer;
        background-color: #2d2d2d;
        color: #f0f0f0;
        }

        #rooms-list li:hover {
        background-color: #3a3a3a;
        }

        #users-list {
        list-style: none;
        padding: 0;
        }

        #users-list li {
        padding: 10px;
        border-bottom: 1px solid #444;
        cursor: pointer;
        background-color: #2d2d2d;
        color: #f0f0f0;
        }

        #users-list li:hover {
        background-color: #3a3a3a;
        }

        #messages-container {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid #444;
        padding: 10px;
        margin-bottom: 10px;
        background-color: #2f2f2f;
        border-radius: 4px;
        }

        .message {
        margin-bottom: 10px;
        }

        .message .author {
        font-weight: bold;
        color: #84bfff;
        /* оттенок синих акцентов */
        }

        #message-form {
        display: flex;
        gap: 10px;
        }

        #message-input {
        flex: 1;
        background-color: #3a3a3a;
        border: 1px solid #555;
        color: #f0f0f0;
        padding: 10px;
        border-radius: 4px;
        }

        .login {
        margin-bottom: 20px;
        }
        </style>

    </head>

    <body>
        <div id="app">
            <button class="login">Login</button>
            <!--<button onclick="getRoomsListRequest()" id="get-rooms-list" type="submit">Отправить</button>-->
            <button id="get-rooms-list">Список комнат</button>
            <button id="create-room">Создать комнату</button>
            <!-- login page -->
            <div id="page-login" class="page active">
                <h2>Войти</h2>
                <form id="login-form">
                    <input type="text" id="username" name="username" placeholder="Имя пользователя" required>
                    <input type="password" id="password" name="password" placeholder="Пароль" required>
                    <!--<button onclick="Login(event)" type="submit">Войти</button>-->
                    <button type="submit">Войти</button>
                </form>
                <div id="login-error" class="error"></div>
            </div>

            <!-- chats list page-->
            <div id="page-rooms" class="page">
                <h2>Список чатов</h2>
                <ul id="rooms-list"></ul>
            </div>

            <!-- chats list page-->
            <div id="page-users" class="page">
                <h2>Список пользователей</h2>
                <ul id="users-list"></ul>
            </div>

            <!-- chat page -->
            <div id="page-room" class="page">
                <button id="back-to-rooms">← Назад</button>
                <h2 id="room-title"></h2>
                <div id="messages-container"></div>
                <form id="message-form">
                    <input type="text" id="message-input" placeholder="Напишите сообщение..." required>
                    <button type="submit">Отправить</button>
                </form>
            </div>
        </div>

        <!--<script src="{{ url_for('static', path='js/script.js') }}"></script>-->
        <script type="module" src="{{ url_for('static', path='js/index.js') }}"></script>
    </body>

</html>
